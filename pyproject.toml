[project]
name = "trust-template"
version = "0.1.0"
description = "Production-grade Python template: uv, ruff, pyright, pytest, release-please, mkdocs, OTel-ready"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Noreddine BEKKOUCHE" }]
keywords = ["template", "uv", "ruff", "pyright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tiger440/python-template"
Documentation = "https://tiger440.github.io/python-template/"
Source = "https://github.com/tiger440/python-template"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trust_template"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
