name: Feature request
description: Propose a change in scope or behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Narrow and finished beats broad and half-done. Describe the problem
        before the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and in what concrete situation?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What the API or behaviour would look like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including doing nothing, or solving it outside this project.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This may need an Architecture Decision Record (adr/)
        - label: This is a breaking change
